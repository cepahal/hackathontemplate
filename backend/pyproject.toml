[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-api"
version = "0.1.0"
description = "A reusable FastAPI foundation for hackathon projects."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "anyio>=4.8,<5",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The original repository also has a placeholder folder named FastAPI.
known-third-party = ["fastapi"]
