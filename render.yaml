# Render Blueprint for the FastAPI backend (Docker) in finalfrontentbackend/backendFINAL.
# See finalfrontentbackend/docs/DEPLOYMENT.md.
#
# Secrets use `sync: false`: Render asks for them when the Blueprint is created; they are never
# stored in this file.
services:
  - type: web
    name: hackathon-backend
    runtime: docker
    plan: free
    rootDir: finalfrontentbackend/backendFINAL
    dockerfilePath: ./finalfrontentbackend/backendFINAL/Dockerfile
    dockerContext: ./finalfrontentbackend/backendFINAL
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
