name: Web and mobile UI
on:
  push:
    paths:
      - 'finalfrontentbackend/frontendFINAL/**'
      - 'mobile/**'
      - '.github/workflows/ui-checks.yml'
  pull_request:
    paths:
      - 'finalfrontentbackend/frontendFINAL/**'
      - 'mobile/**'
      - '.github/workflows/ui-checks.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finalfrontentbackend/frontendFINAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: finalfrontentbackend/frontendFINAL/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-traces
          path: finalfrontentbackend/frontendFINAL/.artifacts/playwright
          retention-days: 7
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run export:web
      - run: npm run export:ios
