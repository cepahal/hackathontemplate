name: Web and mobile UI
on:
  push:
    paths:
      - 'package.json'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/ui-checks.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/ui-checks.yml'
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run setup:mobile
      - run: npm run check:mobile
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-traces
          path: frontend/.artifacts/playwright
          retention-days: 7
