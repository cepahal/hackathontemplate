# CI for the hackathon starter in finalfrontentbackend/ (frontendFINAL, backendFINAL).
# No production secrets are needed: backend tests mock Supabase and every external API, and the
# frontend build uses public placeholder values.
name: hackathon-check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene (no committed env files or public secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a real .env file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v -E '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Environment files must not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No env files tracked."
      - name: Fail if a server-only secret is named NEXT_PUBLIC_* (shipped to the browser)
        run: |
          pattern='NEXT_PUBLIC_[A-Z0-9_]*(SERVICE_ROLE|SECRET|PRIVATE|OPENAI|GEMINI|ANTHROPIC|GROK|GITHUB_TOKEN|RESEND|STRIPE|WEBHOOK)'
          if git grep -nE "$pattern" -- finalfrontentbackend ':!*.md'; then
            echo "::error::Server-only secrets must never use the NEXT_PUBLIC_ prefix."
            exit 1
          fi
          echo "No secret-looking NEXT_PUBLIC_ variables."

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: finalfrontentbackend/frontendFINAL
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Inlined into the bundle at build time; placeholders are enough to compile.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: finalfrontentbackend/frontendFINAL/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  backend:
    name: Backend (validation, typecheck, tests, startup)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: finalfrontentbackend/backendFINAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            finalfrontentbackend/backendFINAL/requirements.txt
            finalfrontentbackend/backendFINAL/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Python validation (compile, lint, format, types)
        run: |
          python -m compileall -q app tests
          ruff check app tests
          ruff format --check app tests
          mypy
      - name: Tests (Supabase and external APIs mocked)
        run: python -m pytest
      - name: Production start command serves /health
        env:
          ENVIRONMENT: production
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
          FRONTEND_URL: https://example.com
          PORT: "8000"
          WEB_CONCURRENCY: "1"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port "$PORT" --workers "$WEB_CONCURRENCY" --proxy-headers &
          server=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/api/v1/health"; then echo; break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/api/v1/health" | grep -q '"ok"'
          # Docs are disabled in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/api/v1/docs")" = "404"
          kill "$server"

  docker:
    name: Backend Docker image (build, non-root, /health)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hackathon-backend:ci finalfrontentbackend/backendFINAL
      - name: Run container and probe /health
        run: |
          docker run -d --name api -p 8080:8080 \
            -e PORT=8080 \
            -e SUPABASE_URL=https://ci-placeholder.supabase.co \
            -e SUPABASE_ANON_KEY=sb_publishable_ci_placeholder \
            -e FRONTEND_URL=https://example.com \
            hackathon-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"ok"'
          if [ "$(docker exec api id -u)" = "0" ]; then echo "::error::container runs as root"; exit 1; fi
          if docker exec api test -e /app/.env; then echo "::error::.env baked into image"; exit 1; fi
      - name: Container logs
        if: always()
        run: docker logs api || true
