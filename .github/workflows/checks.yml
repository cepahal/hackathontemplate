name: Starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  setup:
    name: Setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:scripts
      - run: npm run setup
      - run: npm run preflight
      - name: Verify environment preservation on setup rerun
        shell: bash
        run: |
          printf '\n# Setup rerun preservation check\n' >> backend/.env
          printf '\n# Setup rerun preservation check\n' >> frontend/.env.local
          cp backend/.env backend/.env.before
          cp frontend/.env.local frontend/.env.before
          npm run setup
          cmp backend/.env.before backend/.env
          cmp frontend/.env.before frontend/.env.local
          bash scripts/validate/preflight.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m pip check
